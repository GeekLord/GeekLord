name: Update profile assets

# Rebuilds every graphic on the profile from live GitHub data, verifies the
# result, and commits it back. The README itself is never touched by hand.

on:
  schedule:
    # 03:17 UTC = 08:47 IST, before the working day starts in Lucknow.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: Why are you rebuilding?
        required: false
        default: manual run
  push:
    branches: [master]
    paths:
      - "scripts/**"
      - "data/**"
      - "README.md"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install font tooling
        # fonttools + brotli subset and embed the typefaces that go inside the
        # SVGs; everything else is the standard library.
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Read live GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_stats.py

      - name: Rebuild the graphics
        run: python scripts/build_assets.py

      - name: Rebuild the micro-site
        run: python scripts/build_site.py

      - name: Verify every asset is self-contained
        run: python scripts/check.py

      - name: Commit whatever changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets data site README.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to commit — the graphics are already current."
            exit 0
          fi
          git commit -m "chore(profile): refresh generated assets" \
                     -m "Rebuilt from the GitHub API by .github/workflows/update-profile.yml." \
                     -m "Trigger: ${{ github.event_name }}${{ github.event.inputs.reason }}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Summarise
        run: |
          {
            echo "### Profile assets refreshed"
            echo
            python - <<'PY'
          import json, pathlib
          stats = json.loads(pathlib.Path("data/profile-stats.json").read_text())
          print(f"- contributions (12 mo): **{stats['contributions']:,}**")
          print(f"- commits / PRs: **{stats['commits']:,}** / **{stats['pull_requests']:,}**")
          print(f"- own repositories: **{stats['own_repos']}**, stars: **{stats['stars']}**")
          print(f"- captured: `{stats['generated_at']}`")
          PY
            echo
            echo "Changed files: ${{ steps.commit.outputs.changed == 'true' && 'committed and pushed' || 'none' }}"
          } >> "$GITHUB_STEP_SUMMARY"
